# Jalankan seluruh aplikasi:
#   ./scripts/setup-env.sh        # sekali: buat .env dari .env.example (secret digenerate acak)
#   docker compose up -d --build
#
# Semua nilai konfigurasi berasal dari .env (lihat .env.example & README).
name: sevima-ukt

x-hmac-secrets: &hmac-secrets
  HMAC_SECRET_UCN: ${HMAC_SECRET_UCN:?Jalankan ./scripts/setup-env.sh terlebih dahulu}
  HMAC_SECRET_ITSB: ${HMAC_SECRET_ITSB:?Jalankan ./scripts/setup-env.sh terlebih dahulu}
  HMAC_SECRET_PHB: ${HMAC_SECRET_PHB:?Jalankan ./scripts/setup-env.sh terlebih dahulu}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: ${APP_TIMEZONE:?}
    ports:
      - '${POSTGRES_HOST_PORT:?}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./be
    restart: unless-stopped
    environment:
      <<: *hmac-secrets
      NODE_ENV: production
      PORT: ${BACKEND_PORT:?}
      TZ: ${APP_TIMEZONE}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Jalankan ./scripts/setup-env.sh terlebih dahulu}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:?}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:?}
      SEED_ON_START: ${SEED_ON_START:?}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?}
      EXPIRY_SWEEP_INTERVAL_MS: ${EXPIRY_SWEEP_INTERVAL_MS:?}
    ports:
      - '${BACKEND_HOST_PORT:?}:${BACKEND_PORT}'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./fe
      args:
        VITE_APP_TIMEZONE: ${APP_TIMEZONE}
        VITE_DEMO_PASSWORD: ${FRONTEND_DEMO_PASSWORD:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:${BACKEND_PORT}
    ports:
      - '${FRONTEND_HOST_PORT:?}:80'
    depends_on:
      backend:
        condition: service_healthy

  mock-gateway:
    build: ./mock-gateway
    restart: unless-stopped
    environment:
      <<: *hmac-secrets
      PORT: ${GATEWAY_PORT:?}
      WEBHOOK_URL: http://backend:${BACKEND_PORT}/api/v1/webhooks/payment-gateway
      MAX_RETRIES: ${GATEWAY_MAX_RETRIES:?}
      RETRY_BASE_MS: ${GATEWAY_RETRY_BASE_MS:?}
    ports:
      - '${GATEWAY_HOST_PORT:?}:${GATEWAY_PORT}'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

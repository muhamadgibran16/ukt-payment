<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Payment Gateway</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f172a%22/%3E%3Cpath d=%22M8 12h16M8 17h16M8 22h9%22 stroke=%22%2334d399%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --field: #d1d5db;
      --brand: #0f766e; --brand-dark: #115e59; --brand-soft: #f0fdfa; --ring: #ccfbf1;
      --ok: #15803d; --warn: #b45309; --err: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

    header { background: #0f172a; color: #fff; }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; color: #cbd5e1; font-size: 13px; }
    .target { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #1e293b; color: #cbd5e1; font-size: 12px; max-width: 100%; }
    .target code { background: none; color: #e2e8f0; padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; flex: none; }

    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; grid-template-columns: 380px 1fr; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    main > section { min-width: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    h2 { font-size: 15px; margin: 0 0 12px; }

    .field { margin-top: 14px; }
    .label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; color: #374151; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .control {
      width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--field); border-radius: 8px;
      font: inherit; color: var(--text); background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    .control::placeholder { color: #9ca3af; }
    .uppercase { text-transform: uppercase; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .uppercase::placeholder { text-transform: none; }
    .control:focus, .control:focus-within { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
    .control[aria-invalid="true"] { border-color: var(--err); box-shadow: 0 0 0 3px #fee2e2; }
    .field.is-disabled { opacity: .5; }
    .field.is-disabled .control { background: #f9fafb; cursor: not-allowed; }

    .money { display: flex; align-items: center; padding: 0; overflow: hidden; }
    .money span { padding: 0 10px 0 12px; color: var(--muted); font-weight: 600; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; background: #f9fafb; }
    .money input { flex: 1; min-width: 0; height: 100%; border: 0; padding: 0 12px; font: inherit; font-variant-numeric: tabular-nums; background: transparent; color: inherit; }
    .money input:focus { outline: none; }

    .select { position: relative; }
    .select-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer; }
    .select-trigger:disabled { cursor: not-allowed; }
    .select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .select-value.placeholder { color: #9ca3af; }
    .chevron { width: 16px; height: 16px; color: var(--muted); flex: none; transition: transform .15s; }
    .select.open .chevron { transform: rotate(180deg); }
    .select-menu {
      position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px -10px rgba(15, 23, 42, .25);
      max-height: 280px; overflow: auto; display: none;
    }
    .select.open .select-menu { display: block; }
    .option { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
    .option.active { background: #f3f4f6; }
    .option[aria-selected="true"] { background: var(--brand-soft); }
    .option-check { width: 16px; height: 16px; margin-top: 2px; color: var(--brand); flex: none; visibility: hidden; }
    .option[aria-selected="true"] .option-check { visibility: visible; }
    .option-label { font-weight: 500; }
    .option-desc { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }

    .btn { margin-top: 20px; width: 100%; height: 42px; background: var(--brand); color: #fff; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn:hover { background: var(--brand-dark); }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .error { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #fef2f2; border: 1px solid #fecaca; color: var(--err); font-size: 13px; }
    .error[hidden] { display: none; }
    .field-error { color: var(--err); font-size: 12px; margin-top: 4px; }

    .delivery { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .delivery-head { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
    .badge { padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .s2 { background: #dcfce7; color: var(--ok); } .s4 { background: #fee2e2; color: var(--err); } .s5, .sx { background: #fef3c7; color: var(--warn); }
    pre { margin: 0; padding: 10px 12px; font-size: 12px; overflow: auto; background: #fff; max-height: 260px; white-space: pre-wrap; word-break: break-all; }
    .group { margin-bottom: 20px; }
    .group-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    code { background: #f3f4f6; padding: 1px 4px; border-radius: 4px; font-size: 12px; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Mock Payment Gateway</h1>
        <p>Simulator payment gateway pihak ketiga untuk menguji webhook tagihan UKT.</p>
      </div>
      <span class="target" title="URL tujuan webhook (dilihat dari dalam jaringan Docker)">
        <span class="dot"></span>Target <code id="target">…</code>
      </span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Picu webhook</h2>

      <form id="form" novalidate>
        <div class="field">
          <span class="label" id="institution_code-label">Institusi</span>
          <div class="select" data-name="institution_code" data-placeholder="Tidak ada secret dikonfigurasi"></div>
        </div>

        <div class="field">
          <label class="label" for="invoice_number">Nomor tagihan</label>
          <input class="control uppercase" id="invoice_number" name="invoice_number" placeholder="UKT-20252-2023001" autocomplete="off" spellcheck="false" />
          <div class="field-error" id="invoice_number-error" hidden></div>
        </div>

        <div class="field">
          <span class="label" id="event_type-label">Event</span>
          <div class="select" data-name="event_type"></div>
        </div>

        <div class="field" id="amount-field">
          <label class="label" for="amount">Nominal</label>
          <div class="control money">
            <span>Rp</span>
            <input id="amount" inputmode="numeric" autocomplete="off" placeholder="4.500.000" />
          </div>
          <div class="field-error" id="amount-error" hidden></div>
          <div class="hint">Harus sama dengan nominal tagihan. Isi berbeda untuk mencoba <i>amount mismatch</i>.</div>
        </div>

        <div class="field" id="payment_method-field">
          <span class="label" id="payment_method-label">Metode bayar</span>
          <div class="select" data-name="payment_method"></div>
        </div>

        <div class="field">
          <span class="label" id="scenario-label">Skenario</span>
          <div class="select" data-name="scenario"></div>
        </div>

        <div class="error" id="form-error" role="alert" hidden></div>
        <button class="btn" id="submit" type="submit">Kirim webhook</button>
      </form>
    </section>

    <section class="card">
      <h2>Riwayat pengiriman</h2>
      <div id="history"><p class="empty">Belum ada pengiriman.</p></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const EVENT_OPTIONS = {
      'payment.success': { label: 'Pembayaran berhasil', desc: 'payment.success · dana diterima gateway' },
      'payment.expired': { label: 'Kedaluwarsa', desc: 'payment.expired · VA/kode bayar tidak berlaku lagi' },
    };
    const SCENARIO_LABELS = {
      normal: 'Normal',
      duplicate: 'Duplikat (retry)',
      concurrent_duplicate: 'Duplikat bersamaan (5×)',
      out_of_order: 'Urutan tertukar',
      invalid_signature: 'Signature salah',
      tampered: 'Body diubah setelah ditandatangani',
    };
    const PAYMENT_METHODS = [
      { value: 'VA_BNI', label: 'Virtual Account BNI' },
      { value: 'VA_BRI', label: 'Virtual Account BRI' },
      { value: 'VA_MANDIRI', label: 'Virtual Account Mandiri' },
      { value: 'QRIS', label: 'QRIS' },
    ];

    const CHEVRON = '<svg class="chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd"/></svg>';
    const CHECK = '<svg class="option-check" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L8 12.58l7.3-7.3a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>';
    const selects = {};

    function createSelect(root, options, { onChange } = {}) {
      const name = root.dataset.name;
      const labelId = `${name}-label`;
      root.innerHTML = `
        <button type="button" class="control select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${labelId} ${name}-value">
          <span class="select-value" id="${name}-value"></span>${CHEVRON}
        </button>
        <ul class="select-menu" role="listbox" tabindex="-1" aria-labelledby="${labelId}"></ul>
        <input type="hidden" name="${name}" />`;
      const trigger = root.querySelector('.select-trigger');
      const menu = root.querySelector('.select-menu');
      const hidden = root.querySelector('input');
      const valueEl = root.querySelector('.select-value');
      let activeIndex = -1;

      menu.innerHTML = options.map((o, i) => `
        <li class="option" role="option" id="${name}-opt-${i}" data-index="${i}" aria-selected="false">
          ${CHECK}<span><span class="option-label">${esc(o.label)}</span>${o.desc ? `<span class="option-desc">${esc(o.desc)}</span>` : ''}</span>
        </li>`).join('');
      const items = [...menu.querySelectorAll('.option')];

      const setActive = (i) => {
        activeIndex = Math.max(0, Math.min(items.length - 1, i));
        items.forEach((el, idx) => el.classList.toggle('active', idx === activeIndex));
        items[activeIndex]?.scrollIntoView({ block: 'nearest' });
        menu.setAttribute('aria-activedescendant', items[activeIndex]?.id ?? '');
      };
      const open = () => {
        if (trigger.disabled || !items.length) return;
        Object.values(selects).forEach((s) => s !== api && s.close());
        root.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');
        setActive(Math.max(0, options.findIndex((o) => o.value === hidden.value)));
        menu.focus();
      };
      const close = (refocus = false) => {
        root.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
        if (refocus) trigger.focus();
      };
      const select = (i, { silent = false } = {}) => {
        const option = options[i];
        if (!option) return;
        hidden.value = option.value;
        valueEl.textContent = option.label;
        valueEl.classList.remove('placeholder');
        items.forEach((el, idx) => el.setAttribute('aria-selected', String(idx === i)));
        if (!silent) onChange?.(option.value);
      };

      trigger.addEventListener('click', () => (root.classList.contains('open') ? close() : open()));
      trigger.addEventListener('keydown', (e) => {
        if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); open(); }
      });
      menu.addEventListener('keydown', (e) => {
        const keys = {
          ArrowDown: () => setActive(activeIndex + 1),
          ArrowUp: () => setActive(activeIndex - 1),
          Home: () => setActive(0),
          End: () => setActive(items.length - 1),
          Enter: () => { select(activeIndex); close(true); },
          ' ': () => { select(activeIndex); close(true); },
          Escape: () => close(true),
          Tab: () => close(),
        };
        if (keys[e.key]) { if (e.key !== 'Tab') e.preventDefault(); keys[e.key](); }
      });
      menu.addEventListener('mousemove', (e) => {
        const li = e.target.closest('.option');
        if (li) setActive(Number(li.dataset.index));
      });
      menu.addEventListener('click', (e) => {
        const li = e.target.closest('.option');
        if (li) { select(Number(li.dataset.index)); close(true); }
      });

      if (options.length) select(0, { silent: true });
      else { valueEl.textContent = root.dataset.placeholder || 'Tidak ada opsi'; valueEl.classList.add('placeholder'); trigger.disabled = true; }

      const api = {
        get value() { return hidden.value; },
        setDisabled(disabled) { trigger.disabled = disabled || !options.length; if (disabled) close(); },
        close,
      };
      selects[name] = api;
      return api;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.select')) Object.values(selects).forEach((s) => s.close());
    });

    const amountInput = $('amount');
    const digitsOnly = (s) => s.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    const formatThousands = (digits) => digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

    amountInput.addEventListener('input', () => {
      // Pertahankan posisi kursor berdasarkan jumlah digit di sebelah kirinya.
      const caret = amountInput.selectionStart ?? amountInput.value.length;
      const digitsBeforeCaret = digitsOnly(amountInput.value.slice(0, caret)).length;
      const digits = digitsOnly(amountInput.value).slice(0, 13);
      const formatted = formatThousands(digits);
      amountInput.value = formatted;

      let pos = 0;
      for (let seen = 0; pos < formatted.length && seen < digitsBeforeCaret; pos++) {
        if (/\d/.test(formatted[pos])) seen++;
      }
      amountInput.setSelectionRange(pos, pos);
      setFieldError('amount', null);
    });

    function setFieldError(field, message) {
      const el = $(`${field}-error`);
      const input = $(field);
      el.hidden = !message;
      el.textContent = message ?? '';
      (field === 'amount' ? input.closest('.control') : input).setAttribute('aria-invalid', String(Boolean(message)));
    }
    $('invoice_number').addEventListener('input', () => setFieldError('invoice_number', null));

    const isSuccessEvent = () => selects.event_type.value === 'payment.success';

    function syncEventFields() {
      // Nominal & metode bayar hanya dikirim untuk payment.success.
      const enabled = isSuccessEvent();
      $('amount-field').classList.toggle('is-disabled', !enabled);
      $('payment_method-field').classList.toggle('is-disabled', !enabled);
      amountInput.disabled = !enabled;
      selects.payment_method.setDisabled(!enabled);
      if (!enabled) setFieldError('amount', null);
    }

    function readForm() {
      const invoiceNumber = $('invoice_number').value.trim().toUpperCase();
      const amount = digitsOnly(amountInput.value);
      let valid = true;
      if (!invoiceNumber) { setFieldError('invoice_number', 'Nomor tagihan wajib diisi'); valid = false; }
      if (isSuccessEvent() && !amount) { setFieldError('amount', 'Nominal wajib diisi untuk pembayaran berhasil'); valid = false; }
      if (!valid) return null;
      return {
        institution_code: selects.institution_code.value,
        invoice_number: invoiceNumber,
        event_type: selects.event_type.value,
        amount: isSuccessEvent() ? Number(amount) : undefined,
        payment_method: isSuccessEvent() ? selects.payment_method.value : undefined,
        scenario: selects.scenario.value,
      };
    }

    function showFormError(message) {
      $('form-error').hidden = !message;
      $('form-error').textContent = message ?? '';
    }

    function renderEntry(entry) {
      const items = entry.deliveries.map((d) => {
        const last = d.attempts[d.attempts.length - 1] || {};
        const cls = last.status ? 's' + String(last.status)[0] : 'sx';
        const attempts = d.attempts.map((a) => `#${a.attempt}: ${a.status ?? 'ERR'} (${a.ms}ms)`).join(' · ');
        return `<div class="delivery">
          <div class="delivery-head">
            <span><b>${esc(d.payload.event_type)}</b> · ${esc(d.payload.invoice_number)} · <code>${esc(d.payload.event_id)}</code></span>
            <span class="badge ${cls}">${last.status ?? 'ERROR'}</span>
          </div>
          <pre>${esc(attempts)}\n\nRequest body:\n${esc(d.body)}\n\nX-Signature: ${esc(d.signature)}\n\nResponse:\n${esc(JSON.stringify(last.response ?? last.error, null, 2))}</pre>
        </div>`;
      }).join('');
      const scenario = SCENARIO_LABELS[entry.scenario] ?? entry.scenario;
      return `<div class="group"><div class="group-title">${new Date(entry.at).toLocaleString('id-ID')} · skenario <b>${esc(scenario)}</b></div>${items}</div>`;
    }

    async function loadHistory() {
      const list = await fetch('/api/deliveries').then((r) => r.json());
      $('history').innerHTML = list.length ? list.map(renderEntry).join('') : '<p class="empty">Belum ada pengiriman.</p>';
    }

    async function init() {
      const cfg = await fetch('/api/config').then((r) => r.json());
      $('target').textContent = cfg.webhookUrl;

      createSelect(document.querySelector('[data-name="institution_code"]'),
        cfg.institutions.map((code) => ({ value: code, label: code })));
      createSelect(document.querySelector('[data-name="event_type"]'),
        cfg.eventTypes.map((e) => ({ value: e, label: EVENT_OPTIONS[e]?.label ?? e, desc: EVENT_OPTIONS[e]?.desc })),
        { onChange: syncEventFields });
      createSelect(document.querySelector('[data-name="payment_method"]'), PAYMENT_METHODS);
      createSelect(document.querySelector('[data-name="scenario"]'),
        Object.entries(cfg.scenarios).map(([value, desc]) => ({ value, label: SCENARIO_LABELS[value] ?? value, desc })));

      syncEventFields();
      loadHistory();
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showFormError(null);
      const body = readForm();
      if (!body) return;

      const button = $('submit');
      button.disabled = true;
      button.textContent = 'Mengirim…';
      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) showFormError(data.error);
        await loadHistory();
      } catch {
        showFormError('Tidak dapat menghubungi mock gateway.');
      } finally {
        button.disabled = false;
        button.textContent = 'Kirim webhook';
      }
    });

    init();
  </script>
</body>
</html>
